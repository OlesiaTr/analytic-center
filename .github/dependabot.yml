version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # ESLint 10 waits for eslint-plugin-react, -import and -jsx-a11y (via
    # eslint-config-next) to support it; minor and patch updates still come.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      lint-format:
        patterns:
          - eslint
          - '@eslint/*'
          - 'eslint-*'
          - prettier
          - 'prettier-*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
